name: vigen-stage2-box1-probe
desc: "Stage 2 Box 1 Standalone Component Probes (drqv2, alda, idaac, ppg) on DataSphere gt4i.1"
cmd: >-
  bash ${JOB} ${CODE} ${RESULT} ${WKEY}

inputs:
  - probe_stage2_box1.sh: JOB
  - code.tgz: CODE
  - wandb_key.txt: WKEY

outputs:
  - result.tgz: RESULT

env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04

cloud-instance-type: gt4i.1
