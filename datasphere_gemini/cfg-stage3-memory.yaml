name: vigen-stage3-box1-memory-probe
desc: "Stage 3 Box 1 25,000-Step Time-Series Memory Ceiling & Stability Probe on DataSphere gt4i.1"
cmd: >-
  bash ${JOB} ${CODE} ${RESULT} ${WKEY}

inputs:
  - probe_stage3_memory_ceiling.sh: JOB
  - code.tgz: CODE
  - wandb_key.txt: WKEY

outputs:
  - result.tgz: RESULT

env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04

cloud-instance-type: gt4i.1
