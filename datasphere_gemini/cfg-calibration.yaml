name: vigen-calibration-probe
desc: "Phase 1 Micro-Calibration Probe on DataSphere gt4i.1 (Tesla T4i / NVIDIA L4) by Gemini"
cmd: >-
  bash ${JOB} ${CODE} ${RESULT} ${WKEY}

inputs:
  - probe_setup_calibration.sh: JOB
  - code.tgz: CODE
  - wandb_key.txt: WKEY

outputs:
  - result.tgz: RESULT

env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04

cloud-instance-type: gt4i.1
