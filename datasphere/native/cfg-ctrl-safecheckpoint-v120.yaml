# Proves runnable/_shim/safe_checkpoint.py is actually reachable and correct from inside ctrl's
# real training process on the real remote host -- import path, torch/JAX interop, and atomic
# rename all happen for real here, not just in a local unit test.
name: vigen-ctrl-safecheckpoint-v120
desc: Real remote proof that ctrl's checkpoint writes go through safe_checkpoint without error.
cmd: >-
  timeout --foreground 3600s env
  CELLS=ctrl:1
  FRAMES=10000
  TASK=Door
  SEED=1
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  EVAL_EVERY_FRAMES=2147483647
  EVAL_EPISODES=1
  SAVE_EVERY_FRAMES=5000
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v120.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4i.1
