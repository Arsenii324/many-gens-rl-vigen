# [Claude 2026-09-02 19:55 MSK: S0 of the staged plan -- prove the clone blocker is gone.
#
# Every job until now began with `git clone https://github.com/gemcollector/RL-ViGen.git` inside
# the billed container. On 2026-09-02 that started failing for every baseline with `could not read
# Username for 'https://github.com'`, after three retries, while the same repository answered
# git ls-remote from the laptop and returned exactly the pinned commit. RL-ViGen is now a job
# INPUT: a pristine tree at 90d8b8c4, sha256-checked by the runner before extraction.
#
# drqv2 because it is the cheapest measured baseline and it exercises the whole RL-ViGen path --
# the patch set, the import gate, the robosuite closure and an actual training step. 6000 frames
# because the family floor is 4001 (num_seed_frames is 4000 and no training curve exists below
# it), and this run is about the bootstrap, not about learning.
#
# The one line that decides the outcome is NATIVE_RLVIGEN_FROM_INPUT in the log.]
name: vigen-native-ctrl-input-v38
desc: S1 -- ctrl first CUDA contact, with RL-ViGen shipped as an input rather than cloned.
cmd: >-
  timeout --foreground 4800s env
  RLVIGEN_ARCHIVE=${RLVIGEN}
  CUDA_ROOT=/usr/local/cuda
  CELLS=ctrl FRAMES=2560 TASK=Door SEED=1
  EVAL_EPISODES=2 CELL_TIMEOUT_SECONDS=3600
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v46.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
outputs:
  - result.tgz: RESULT
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04
cloud-instance-type: gt4.1

# SUPERSEDED 2026-09-05: the tier it requests is below the minimum its family now declares
# (ctrl and alda both require gt4i.1). Kept as the record of what was run; resubmitting it as
# written would be SIGKILLed, which is how this was discovered.
