# Validation of the rlvigen evaluator via svea, against the frozen code revision
# 4bef9881a418c2d88a450d38a902bd3aa159d724a651741917935caa826435d2 (payload-v118).
#
# svea holds Places365 overlay images in memory, so it -- not drqv2 -- is what a rlvigen family memory peak must be measured on. drqv2 measures 3.31 GiB and is the family's LIGHTEST member.
#
# Runs on gt4i.1 because rlvigen is NOT CERTIFIABLE for memory -- no recorded fixed_peak_gib -- and
# the larger tier is the safe direction while the number is unknown. This job produces that number.
name: vigen-svea-functional-v118
desc: Validate the rlvigen endpoint evaluator via svea and measure the family memory peak.
cmd: >-
  timeout --foreground 10800s env
  CELLS=svea:1
  FRAMES=10000
  TASK=Door
  SEED=1
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  EVAL_EVERY_FRAMES=2147483647
  EVAL_EPISODES=1
  SAVE_EVERY_FRAMES=10000
  ENDPOINT_EVAL=1
  ENDPOINT_EVAL_REGIMES=train,eval-easy
  ENDPOINT_EVAL_SCENES=0
  ENDPOINT_EVAL_EPISODES=5
  ENDPOINT_EVAL_DEVICE=cuda
  PLACES365_EXPECTED_COUNT=36500
  PLACES365_EXPECTED_SHA256=70237503ec14fba495dd9440ce2901707447a142933773a4441e446788f57669
  RLVIGEN_PLACES_WORKERS=0
  bash ${JOB} ${CODE} ${RESULT} ${PLACES365_VAL}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v118.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
  - places365-val.tgz: PLACES365_VAL
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4i.1
