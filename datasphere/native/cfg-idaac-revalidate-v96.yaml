# Recompute IDAAC's evaluator-agreement row after the fresh-source P20 repair.
#
# v93 reached the container bootstrap but P20's old anchor generated invalid Python only when the
# pristine RL-ViGen archive was patched there.  This retry has the same checkpoint and grid, but
# carries the repaired patcher in an IDAAC-only payload.  It is an evaluator validation, not a
# production training run.
name: vigen-idaac-revalidate-v96
desc: Recompute the IDAAC evaluator row on the repaired CUDA evaluator.
cmd: >-
  timeout --foreground 3600s env
  CELLS=idaac:1
  FRAMES=100000
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  OFFLINE_EVAL_SNAPSHOT=${SNAPSHOT}
  OFFLINE_EVAL_FAMILY=idaac
  OFFLINE_EVAL_BASELINE=idaac
  OFFLINE_EVAL_SEED=1
  OFFLINE_EVAL_FRAME=100000
  OFFLINE_EVAL_EPISODES=20
  OFFLINE_EVAL_REGIMES=train,eval-easy
  OFFLINE_EVAL_SCENES=0
  OFFLINE_EVAL_DEVICES=cuda
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v96.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
  - /Users/a2mogus/.claude/jobs/d037da9e/tmp/idaac-100k-snapshot.pt: SNAPSHOT
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4.1
