# Validation of the rlvigen evaluator against the FROZEN code revision
# 4a77df8be2c5a197484237f2e7f11141ce3f9c371351d6e7c687cf0ae1440e82 (payload-v116).
#
# The RL-ViGen five (drqv2/svea/drq/sgqn/curl) share one evaluator entry; drqv2 stands for the family. DrQ-v2 trains slowest of the seven, hence the larger budget.
#
# Ten thousand frames exist only to produce a real checkpoint; the 2x1x5 endpoint grid is the
# measurement. Read in the records: diagnostics_available=true on every row (now REQUIRED --
# ENDPOINT_EVAL=1 makes a diagnostics-less row raise rather than record), evaluator_code_revision
# equal to the hash above, and initial_placement paired across the two regimes.
name: vigen-drqv2-functional-v116
desc: Validate the rlvigen-family endpoint evaluator via drqv2 on CUDA against the frozen evaluator code revision.
cmd: >-
  timeout --foreground 10800s env
  CELLS=drqv2:1
  FRAMES=10000
  TASK=Door
  SEED=1
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  EVAL_EVERY_FRAMES=2147483647
  EVAL_EPISODES=1
  SAVE_EVERY_FRAMES=10000
  ENDPOINT_EVAL=1
  ENDPOINT_EVAL_REGIMES=train,eval-easy
  ENDPOINT_EVAL_SCENES=0
  ENDPOINT_EVAL_EPISODES=5
  ENDPOINT_EVAL_DEVICE=cuda
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v116.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4i.1
