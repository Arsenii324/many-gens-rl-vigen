name: vigen-native-drqv2-calibration-a-v19
desc: Native DrQ-v2 Door 10k terminal-evaluation & snapshot retention calibration; serial readiness evidence only.
cmd: >-
  timeout --foreground 1800s env
  BASELINE=drqv2 FRAMES=10000 TASK=Door SEED=1
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - native-payload-v19.tgz: CODE
