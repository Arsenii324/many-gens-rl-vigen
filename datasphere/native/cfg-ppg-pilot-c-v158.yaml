# [Claude 2026-09-06] DECISION-SHEET A36 fidelity pilot, treatment arm (PPG-C = the published
# continuous-control recipe, minimally Door-adapted). Companion to cfg-ppg-pilot-p-v157.yaml
# (PPG-P, control). See that file for the shared decision rule and frame-budget reasoning.
#
# NATIVE_EXTRA_OVERRIDES appends after family.py's own argv; argparse's standard last-flag-wins
# resolves each duplicate in favor of this override. All five flags below were ADDED to
# runnable/ppg/phasic_policy_gradient/train.py this session specifically to make this pilot
# expressible (previously reachable only as train_fn Python defaults, not from any launch path;
# entcoef was not even threaded to train_fn's ppo_hps dict, so no launch path could touch it at
# all -- see the DECISION-SHEET A36 note and the commit that added these flags):
#   gamma .999->.99, lr 5e-4->3e-4, aux_lr 5e-4->3e-4, nminibatch 8->32, entcoef .01->0
#   (independently corroborated by C61's measured categorical-to-Gaussian entropy-coefficient
#   failure on the sibling ibac_sni port).
# num_envs/nstep unchanged (A26 already fixed this cadence). Frame stack held at 1 for this first
# pilot -- not incoherent for PPG (C2: "lineage only", no mechanism-level objection) but applying
# it needs a real env-wrapper code path deserving its own verification, declared rather than
# silently dropped (A36).
name: vigen-ppg-pilot-c-v158
desc: "A36 fidelity pilot: PPG-C (published continuous-control recipe), one seed, 245760 frames."
cmd: >-
  timeout --foreground 18000s env
  NATIVE_HOST_PROFILE=datasphere
  CELLS=ppg:1
  FRAMES=245760
  TASK=Door
  SEED=1
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  EVAL_EVERY_FRAMES=2147483647
  EVAL_EPISODES=1
  SAVE_EVERY_FRAMES=40960
  ENDPOINT_EVAL=1
  ENDPOINT_EVAL_REGIMES=train,eval-easy
  ENDPOINT_EVAL_SCENES=0
  ENDPOINT_EVAL_EPISODES=5
  ENDPOINT_EVAL_DEVICE=cuda
  NATIVE_EXTRA_OVERRIDES="--gamma 0.99 --lr 3e-4 --aux_lr 3e-4 --nminibatch 32 --entcoef 0"
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v154-ppg-pilot.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4.1
