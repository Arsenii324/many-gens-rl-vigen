# ctrl has NEVER been validated on CUDA, and its evaluator double-reset was only fixed on
# 2026-09-05 -- so any earlier ctrl result is void regardless. This is the first run that
# can be believed, and it specifically exercises the fix: measured episode i must run
# placement condition index i, not 2i.
#
# What to read in the records: 5 episodes per regime, diagnostics_available=true, and
# `placement_condition_seeds` that MATCH the physical initial_placement across regimes --
# scripts/audit_pairing_evidence.py checks exactly that.
#
# Current-contract functional validation for the last evaluator family without a usable retained
# checkpoint.  Ten thousand frames merely produces a real dmc_gb checkpoint; the 2x1x5 endpoint
# grid tests construction, strict regime read-back, loader, action path, CUDA placement and records.
name: vigen-ctrl-functional-v117
desc: Train a bounded CTRL cell and exercise the current ctrl endpoint evaluator on CUDA, validating the double-reset fix.
cmd: >-
  timeout --foreground 7200s env
  CELLS=ctrl:1
  FRAMES=10000
  TASK=Door
  SEED=1
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  EVAL_EVERY_FRAMES=2147483647
  EVAL_EPISODES=1
  SAVE_EVERY_FRAMES=10000
  ENDPOINT_EVAL=1
  ENDPOINT_EVAL_REGIMES=train,eval-easy
  ENDPOINT_EVAL_SCENES=0
  ENDPOINT_EVAL_EPISODES=5
  ENDPOINT_EVAL_DEVICE=cuda
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v117.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4i.1
