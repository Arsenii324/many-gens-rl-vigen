# [Claude 2026-09-04: the LAST unmeasured continuous PPO head. C61's default now rests on three
# baselines -- idaac (99,328 frames), ppg (4,096) and ctrl (8,224) -- whose drift ranks in the order
# the mechanism predicts. `ibac_sni` is the one the 2026-09-02 update singles out as MOST exposed:
# no clamp, no advantage normalisation, and the 227x model of C3. It has never produced a
# checkpoint from which a log-std could be read, so the entry's central claim about its worst case
# is untested.
#
# 100k, not 10k, and the reason is comparability rather than thoroughness: idaac's number is a 100k
# number, and matching the budget removes the linear extrapolation that is currently the weakest
# step in the ranking. ibac_sni measured 26.63 fps at 10k, so ~63 min on gt4.1.
#
# It already logs the diagnostic -- `torch_rl/scripts/train.py:253-257` appends sigma_mean,
# mean_log_std and boundary_fraction to log.csv when acmodel.log_std exists. Nothing in the clone
# needs to change; this run only has to happen.
#
# DERIVED FROM ibac_sni's OWN known-good config (cfg-preprod-ibacsni-v52.yaml), not from another
# family's -- which is the morning's CUDA_ROOT lesson applied: v52 already carries CUDA_ROOT and
# gt4.1, and copying a torch job's config onto ctrl is exactly what cost two failed jobs.
# RECORDS_OUT added so the cheap artifact comes back without the archive.]
#
# [Claude 2026-09-03: PRE-PRODUCTION VALIDATION PASS, 5 of 7.
#
# This is a validation of the clone-to-curve chain, NOT a science result, and the distinction is
# the whole design. R7 currently reads "the chain breaks at: training log, eval result set.
# Present: 0 training log(s), 0 eval grid" and R4 asks for equal training length or a stated
# reason. Twelve baselines at ONE common budget, one seed, on CUDA, each running its own
# repository's train.py, answers both -- and 10,000 frames is deliberately far below what learns
# Door (drqv2 needed 100k to reach 456), so the numbers this produces are a PIPELINE result and
# must never be quoted as a generalisation result.
#
# Why 10k and not 50k: the 50k version prices at 3,286 RUB for the ten measured baselines alone,
# and alda + ctrl (both gt4i.1, both unmeasured) push the total past the 4,000 ceiling. 10k costs
# roughly 950 RUB for all twelve. Evaluation is cheap; it was training that made the sweep
# expensive -- the ten-scene grid cost 59 RUB for 21 minutes.
#
# Cells run SEQUENTIALLY (NATIVE_CONCURRENT unset), so a multi-cell job packs bootstrap cost
# without stacking replay memory. Every floor is cleared: the highest is rlvigen's 4001.
#
# Gate decisions C1-C4 were taken BEFORE this run, per the register's own rule that deciding them
# after seeing which choice flatters a baseline is a garden of forking paths.]
name: vigen-c61-ibacsni-100k-v74
desc: C61 policy-health measurement for ibac_sni, the last unmeasured continuous head, at 100k.
cmd: >-
  timeout --foreground 14400s env
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  CELLS=ibac_sni:1 FRAMES=100000 TASK=Door SEED=1
  EVAL_EPISODES=10 CELL_TIMEOUT_SECONDS=12600
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v63.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04
cloud-instance-type: gt4.1
