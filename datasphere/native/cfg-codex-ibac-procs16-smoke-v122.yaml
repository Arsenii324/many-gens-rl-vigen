# Small T4 smoke for the repaired Door multiprocessing path.
#
# This is intentionally not a competence or production run: it only answers whether the intended
# upstream process count can construct independent MuJoCo/EGL workers under Linux. The descriptor
# still carries its normal DataSphere value; NATIVE_EXTRA_OVERRIDES is recorded in the run manifest
# and appends the exact `--procs=16` override after the descriptor command.
name: vigen-codex-ibac-procs16-smoke-v122
desc: Smoke-test IBAC-SNI Door spawn/factory execution at the intended upstream procs=16 on gt4.1.
cmd: >-
  timeout --foreground 3600s env
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  CELLS=ibac_sni:1
  FRAMES=2560
  TASK=Door
  SEED=1
  EVAL_EPISODES=1
  CELL_TIMEOUT_SECONDS=1800
  NATIVE_EXTRA_OVERRIDES=--procs=16
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-codex-ibac-procs16-v122.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4.1
