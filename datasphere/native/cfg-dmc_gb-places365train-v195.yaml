# [Claude 2026-09-07] Attesting wave, Phase 2: the v194 dmc_gb entry used the rad baseline, which does
# not touch Places365 (family.py needs-places365 --cells rad:1 -> false) -- and separately fixed
# the RLVIGEN_IMAGE_SIZE gap in run_endpoint_eval/run_curve_eval/run_offline_eval. soda is dmc_gb's
# Places365-needing baseline; this exercises configure_places365_val.py under
# NATIVE_PLACES365_SPLIT=train (dmc_gb flavor: runnable/dmc_gb/src/augmentations.py) and produces
# the family_code_revision that reflects the DECIDED (A22) production split.
#
# Same places365-train-attest.tgz as the rlvigen sibling job -- a TRAIN LOADER-PATH ATTESTATION
# FIXTURE, NOT production Places365 dataset certification: val/images unchanged (36500, hash
# intact), train/ a 1000-image/20-class representative sample -- sufficient for
# configure_places365_val.py's directory-only check on the train branch. The production asset
# (~1.8M images, 365 classes) must separately pass `python3 setup/verify_datasets.py --split train`
# on the production host before svea/sgqn/soda run against it.
name: vigen-dmc_gb-places365train-v195
desc: Schema-2 evaluator identity re-validation for dmc_gb under the DECIDED train split (A22), via soda.
cmd: >-
  timeout --foreground 3600s env
  NATIVE_HOST_PROFILE=datasphere
  CELLS=soda:1
  FRAMES=10000
  TASK=Door
  SEED=1
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  EVAL_EVERY_FRAMES=2147483647
  EVAL_EPISODES=1
  SAVE_EVERY_FRAMES=10000
  ENDPOINT_EVAL=1
  ENDPOINT_EVAL_REGIMES=train,eval-easy
  ENDPOINT_EVAL_SCENES=0
  ENDPOINT_EVAL_EPISODES=5
  ENDPOINT_EVAL_DEVICE=cuda
  NATIVE_PLACES365_SPLIT=train
  PLACES365_EXPECTED_COUNT=36500
  PLACES365_EXPECTED_SHA256=70237503ec14fba495dd9440ce2901707447a142933773a4441e446788f57669
  bash ${JOB} ${CODE} ${RESULT} ${PLACES365_TRAIN}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v194-dmc_gb.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
  - places365-train-attest.tgz: PLACES365_TRAIN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4i.1
