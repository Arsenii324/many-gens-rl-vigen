# SUPERSEDED 2026-09-06: this config's payload predates CORRECTIONS.md #94's schema-2
# evaluator-identity fix (schema 1 baked NATIVE_HOST_PROFILE into every family's revision,
# so no validation done under one profile could ever read as current under another). Kept
# as the record of the job that ran; resubmitting it would validate a superseded identity
# scheme, not the current one. Replacement: cfg-ibac_sni-revalidate-v151.yaml.
# [Claude 2026-09-06] Re-validation of the ibac_sni evaluator family against the CURRENT tree,
# superseding notes/EVALUATOR-VALIDATION-STATUS.md's 2026-09-05 entries (frozen hash
# 4bef9881a418c2d88a450d38a902bd3aa159d724a651741917935caa826435d2) and validated_evaluator_families.json's
# legacy null-field entries, which record real job/pairing evidence but never carried the
# family-closure-scoped revision fields (family_code_revision/family_config_revision/evaluator_revision/
# evaluator_scope*) the current production_gates.py::gate_shared_evaluator_validated actually checks.
# Substantial shared evaluator code has changed since the 2026-09-05 freeze -- most concretely
# CORRECTIONS #88's AppleDouble-sidecar fix in evaluator_identity.py's own _runtime_tree_members,
# which is part of every family's hashed runtime closure -- so a fresh functional-endpoint run is
# needed, not a backfill of the old ledger's fields from stale evidence.
#
# Same shape as the proven cfg-ibac_sni-functional-v119.yaml template: ibac_sni:1 for 10000 frames (enough to produce a real
# checkpoint), then a 2-regime x 1-scene x 5-episode endpoint grid on CUDA. Payload rebuilt fresh
# via `contract.py build-payload --families ibac_sni` against the current tree (payload-v141-ibac_sni.tgz).
name: vigen-ibac_sni-revalidate-v141
desc: Re-validate the ibac_sni endpoint evaluator on CUDA against the CURRENT (post-AppleDouble-fix) code revision.
cmd: >-
  timeout --foreground 10800s env
  CELLS=ibac_sni:1
  FRAMES=10000
  TASK=Door
  SEED=1
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  EVAL_EVERY_FRAMES=2147483647
  EVAL_EPISODES=1
  SAVE_EVERY_FRAMES=10000
  ENDPOINT_EVAL=1
  ENDPOINT_EVAL_REGIMES=train,eval-easy
  ENDPOINT_EVAL_SCENES=0
  ENDPOINT_EVAL_EPISODES=5
  ENDPOINT_EVAL_DEVICE=cuda
  bash ${JOB} ${CODE} ${RESULT}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v141-ibac_sni.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4.1
