# SUPERSEDED by cfg-<family>-attest-v196.yaml. These two were cancelled mid-flight on
# 2026-09-07 (they predate the hardcoded-val assertion repair), and their 3600s budget is
# now known to be too tight for a Places365 cell anyway: soda measures 2.9 fps, so 10k
# frames need ~4885s. Kept as history, not for submission.
# [Claude 2026-09-07] Attesting wave, Phase 2: the v194 rlvigen entry used the drqv2 baseline, which
# does not touch Places365 at all (family.py needs-places365 --cells drqv2:1 -> false), so that
# attestation says nothing about the train-split path A22 decided production must use. svea is
# rlvigen's Places365-needing baseline; this exercises configure_places365_val.py under
# NATIVE_PLACES365_SPLIT=train and produces the family_code_revision that actually reflects it.
#
# places365-train-attest.tgz is a TRAIN LOADER-PATH ATTESTATION FIXTURE, NOT production Places365
# dataset certification: places365-val.tgz's own val/images/ (36500 files, unchanged hash) plus a
# 1000-image/20-class sample of the real train split (extracted locally from the now-verified
# places365standard_easyformat.tar) under train/. configure_places365_val.py only checks that
# places365_standard/train/ is a directory for split=train -- no count/hash requirement, per its
# own source -- so a small representative sample is sufficient to exercise the real code path
# without shipping the full ~1.8M-image, 365-class production population to a smoke cell. The
# production asset must separately pass `python3 setup/verify_datasets.py --split train` on the
# production host before svea/sgqn/soda run against it.
name: vigen-rlvigen-places365train-v195
desc: Schema-2 evaluator identity re-validation for rlvigen under the DECIDED train split (A22), via svea.
cmd: >-
  timeout --foreground 9000s env
  NATIVE_HOST_PROFILE=datasphere
  CELLS=svea:1
  FRAMES=10000
  TASK=Door
  SEED=1
  RLVIGEN_ARCHIVE=${RLVIGEN}
  RECORDS_OUT=${RECORDS}
  CUDA_ROOT=/usr/local/cuda
  EVAL_EVERY_FRAMES=2147483647
  EVAL_EPISODES=1
  SAVE_EVERY_FRAMES=10000
  ENDPOINT_EVAL=1
  ENDPOINT_EVAL_REGIMES=train,eval-easy
  ENDPOINT_EVAL_SCENES=0
  ENDPOINT_EVAL_EPISODES=5
  ENDPOINT_EVAL_DEVICE=cuda
  NATIVE_PLACES365_SPLIT=train
  PLACES365_EXPECTED_COUNT=1000
  PLACES365_EXPECTED_SHA256=c08327c5baf66746d2caf2f6f126c297fa421280d90a7d17eb903e7939dfed2e
  bash ${JOB} ${CODE} ${RESULT} ${PLACES365_TRAIN}
inputs:
  - datasphere/native/run_probe.sh: JOB
  - datasphere/native/payload-v194-rlvigen.tgz: CODE
  - rlvigen-door2-90d8b8c4.tgz: RLVIGEN
  - places365-train-attest.tgz: PLACES365_TRAIN
outputs:
  - result.tgz: RESULT
  - records.jsonl: RECORDS
env:
  docker:
    image: nvidia/cuda:12.2.2-runtime-ubuntu22.04@sha256:94c1577b2cd9dd6c0312dc04dff9cb2fdce2b268018abc3d7c2dbcacf1155000
cloud-instance-type: gt4i.1
