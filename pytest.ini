[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    slow: builds a real robosuite environment or trains. Excluded with `-m "not slow"`.

# The DEFAULT runs everything. A default that skips is how coverage silently erodes, and
# `mutants/run.py` uses this suite as its oracle -- a mutant that only a slow test would catch
# must not survive because the oracle skipped it. For the inner development loop:
#     pytest tests -m "not slow"       # 133s measured 2026-08-24 (127s on 08-17, 119s on 08-16, 67s when written)
#     pytest tests                     # 279s measured 2026-08-24 (240-273s on 08-17, 249s, 109s); CI + mutants
#
# 2026-08-24, RE-MEASURED on an idle machine: fast 132.72s (818 passed, 24 skipped, 44 deselected),
# full 278.99s (862 passed, 24 skipped, 0 failed). Three tests were added to `slow` the same day --
# `test_sweep_gaps::test_preflight_does_not_fire_for_a_baseline_with_no_data_needs` and the
# `test_seam_behaviourally` module (both build real robosuite envs, and the latter's docstring had
# said so since it was written without carrying the marker), plus
# `test_onpolicy::test_on_policy_and_off_policy_runs_are_comparable` (two real training loops,
# sitting unmarked beside marked-slow siblings). The oracle is unaffected: the default run still
# executes everything, which is the property `mutants/run.py` depends on.
#
# **Read the two numbers above as a pair, and distrust either alone.** The same full suite measured
# **349.73s** the same day on the same tree while unrelated training jobs held the load average
# near 4 -- a 25% inflation from machine state, larger than every optimisation made that day
# combined (~13s from caching three pure repo-scans). This is the failure this block already
# records once, in a new form: not a stale number, but a *contended* one. A timing here is evidence
# only if the box was idle, so record the load alongside it or do not record it.
#
# MEASURED, not estimated -- and RE-MEASURED 2026-08-17 (342 passed, 1 skipped), because the
# numbers above had more than doubled while the conclusion drawn from them stayed put. The
# 2026-08-17 growth is the runnable-originals work: three subprocess-based test files
# (test_mps_shim, test_success_metric, test_observation_geometry, test_docs_not_stale), two of
# which build a real robosuite env and are marked slow. The marker now covers
# tests/test_real_env.py, the two on-policy training tests, and the 48s nd_ln end-to-end (added
# 2026-08-16; it was the single largest test in the suite and was unmarked). Saving: 130s.
#
# The remaining cost is spread thinly -- no single dominator above ~10s -- so going lower means
# marking more, and every test marked is one the fast loop stops checking. Left as it is; the
# tradeoff is a judgement and the numbers must be visible to whoever makes it. Note the failure
# this line already had once: a stale measurement kept driving a live decision.
#
# 2026-08-17, RE-MEASURED at 370 collected with --durations=25, and the earlier diagnosis above
# is CORRECT but the cause was misattributed on the first guess. The cost is NOT the work: the
# 48s nd_ln test runs sixteen timesteps. It is PROCESS STARTUP -- importing torch, mujoco and
# robosuite, once per subprocess -- and `scripts/deviations.py`, which was the obvious suspect,
# does not appear in the top 25 at all. That matters because startup cost is the price of the
# subprocess isolation this project deliberately buys: each clone is imported with its own
# sys.path, because importing all of them into one interpreter is exactly the join the whole
# project avoids. The suite is slow for the same reason the results are trustworthy.
#
# Which also means it PARALLELISES almost perfectly, since the isolation is already there:
#     pytest -n 6                      # 86s wall, measured 2026-08-17, same 1 skip / 0 failures
# vs 301s serial on the same tree -- 3.5x, and it needs no test to be marked or skipped.
# NOT made the default deliberately: `mutants/run.py` uses this suite as its oracle and a
# parallel oracle can reorder work in ways a mutation harness should not have to reason about,
# and xdist is an extra dependency a fresh checkout may not have. Use it in the inner loop, keep
# the serial run for anything whose result is being recorded.
filterwarnings =
    ignore::DeprecationWarning
